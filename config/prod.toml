# Production environment configuration
# Overrides base.toml values for production deployment
# Secrets should be provided via environment variables in production

[logger]
log_level = "info"

[database]
hostname = "mariadb-server.gsmlg.net"
database = "gsmlg_prod"
pool_size = 20
show_sensitive_data_on_connection_error = false

[web]
url = "https://gsmlg.org"
port = 4110

[admin_web]
url = "https://admin.gsmlg.org"
port = 4111

[commander]
start = false
