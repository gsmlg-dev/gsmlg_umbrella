variables:
  DOCKER_REGISTRY: gsmlg.dev
  DOCKER_IMAGE_NAME: apps/gsmlg

include:
  - local: "/apps/gsmlg_commander/.gitlab-ci.yml"

stages: # List of stages for jobs, and their order of execution
  - test
  - release
  - build
  - publish

cache:
  - key:
      files:
        - mix.lock
    paths:
      - deps
      - _build

svc-unit-test:
  tags:
    - docker
    - linux
  stage: test
  image:
    name: gsmlg/phoenix:alpine
    entrypoint:
      - /bin/bash
      - "-c"
  rules:
    - changes:
        - "apps/gsmlg/*"
        - "apps/gsmlg_web/*"
        - "apps/gsmlg_admin_web/*"
        - "config/**/*"
        - "mix.*"
  variables:
    MIX_ENV: test
    GSMLG_UMBRELLA: "true"
  script:
    - mix deps.get --only test
    - mix format --check-formatted
    - mix test apps/gsmlg/test
    - mix test apps/gsmlg_web/test
    - mix test apps/gsmlg_admin_web/test

svc-release:
  dependencies:
    - "svc-unit-test"
  tags:
    - docker
    - linux
  stage: release
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|beta|alpha)$/
      exists:
        - Dockerfile.lite
      changes:
        - "apps/gsmlg/*"
        - "apps/gsmlg_web/*"
        - "apps/gsmlg_admin_web/*"
        - "config/**/*"
        - "mix.*"
  image: gsmlg/semantic-release
  variables:
    MIX_ENV: prod
  script:
    - semantic-release
  artifacts:
    paths:
      - releaseVersion

svc-build:
  dependencies:
    - svc-release
  tags:
    - docker
    - linux
  stage: build
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|beta|alpha)$/
      exists:
        - Dockerfile.lite
      changes:
        - "apps/**/*"
        - "config/**/*"
        - "mix.*"
  image: gsmlg/phoenix:alpine
  variables:
    MIX_ENV: prod
    WEB_VERSION: 1.45.1
  script:
    - mix deps.get
    - cd ${CI_PROJECT_DIR}/apps/gsmlg_admin_web/assets && npm install && npm install --prefix ../../../deps/phoenix_duskmoon/
    - cd ${CI_PROJECT_DIR}/apps/gsmlg_admin_web && mix assets.deploy
    - cd ${CI_PROJECT_DIR}/apps/gsmlg_web/assets && npm install
    - cd ${CI_PROJECT_DIR}/apps/gsmlg_web && mix assets.deploy
    - cd ${CI_PROJECT_DIR}
    - curl -Lf "${NPM_CONFIG_REGISTRY}/@gsmlg/website/-/website-${WEB_VERSION}.tgz" -o website.tgz
    - tar xzf website.tgz --strip-components=2 -C ${CI_PROJECT_DIR}/apps/gsmlg_web/priv/static
    - ./update_version.sh "$(cat ${CI_PROJECT_DIR}/releaseVersion)"
    - mix release gsmlg_umbrella --version "$(cat ${CI_PROJECT_DIR}/releaseVersion)"
    - cp -r _build/prod/rel/gsmlg_umbrella app
  artifacts:
    paths:
      - app

svc-build-image:
  dependencies:
    - svc-release
    - svc-build
  tags:
    - docker
    - linux
  stage: publish
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|beta|alpha)$/
      exists:
        - Dockerfile.lite
      changes:
        - "apps/**/*"
        - "config/**/*"
        - "mix.*"
  image:
    name: docker.io/gsmlg/kaniko-executor:debug
    entrypoint: [""]
  before_script:
    - echo $DOCKER_AUTH_CONFIG > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile $CI_PROJECT_DIR/Dockerfile.lite \
        --destination "gsmlg.dev/apps/gsmlg:$(cat ${CI_PROJECT_DIR}/releaseVersion)" \
        --destination "gsmlg.dev/apps/gsmlg:latest" \
        --destination "docker.io/gsmlg/gsmlg.org:v$(cat ${CI_PROJECT_DIR}/releaseVersion)" \
        --destination "docker.io/gsmlg/gsmlg.org:latest" \
        --destination "ghcr.io/gsmlg-dev/gsmlg-svc:v$(cat ${CI_PROJECT_DIR}/releaseVersion)" \
        --destination "ghcr.io/gsmlg-dev/gsmlg-svc:latest"
