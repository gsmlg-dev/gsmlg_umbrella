[gsmlg]

[logger]
log_level = "warning"

[database]
username = "gsmlg_test"
password = "gsmlg_test"
# Use localhost for CI compatibility - override with POSTGRES_HOST env var if needed
hostname = "localhost"
port = 5432
database = "gsmlg_test"
show_sensitive_data_on_connection_error = true
pool_size = 5

[web]
url = "http://localhost:4112"
secret_key_base = "test_secret_key_base_test_secret_key_base_test_secret_key_base_test"
port = 4112
user_register = false
enable_adsense = false
show_icp = false

[admin_web]
url = "http://localhost:4113"
secret_key_base = "test_secret_key_base_test_secret_key_base_test_secret_key_base_test"
port = 4113
user_register = false
client_certificate_auth = false

[commander]
start = false
name = "test_commander"
platform_url = "ws://localhost:4113/commander-socket/websocket"
platform_key_env = "GSMLG_COMMANDER_PLATFORM_KEY"
platform_credentials_env = "GSMLG_COMMANDER_PLATFORM_CREDENTIALS_JSON"
max_in_flight_rpcs = 2

[commander.tls]
enabled = false
reload_interval_ms = 60000

[browser]
enabled = false
inline_artifact_max_bytes = 131072
event_retention_days = 30
upload_base_url = ""
upload_ttl_seconds = 300

[browser.jobs]
dispatch_timeout_ms = 30000
reconcile_interval_ms = 30000
default_deadline_ms = 7200000
max_attempts = 3

[browser.security]
allowed_schemes = ["https"]
allow_css_locator = false
allow_downloads = true
max_observation_bytes = 1048576
max_artifact_bytes = 104857600

[browser_agent]
enabled = false
backend = "cloakbrowser"
manager_url = "http://127.0.0.1:8080"
manager_token_env = "CLOAKBROWSER_MANAGER_TOKEN"
state_dir = "tmp/browser-agent-test"
max_concurrent_sessions = 1
max_concurrent_workflows = 1
keep_profile_running = true
max_observation_bytes = 1048576
max_artifact_bytes = 104857600
inline_artifact_max_bytes = 131072
journal_terminal_max_records = 10000
journal_terminal_max_age_ms = 2592000000
journal_terminal_max_bytes = 67108864
journal_recovery_scan_max_records = 10000

[browser_agent.security]
allow_css_locator = false
allowed_origins = ["https://gemini.google.com", "https://accounts.google.com", "https://www.youtube.com", "https://youtube.com", "https://youtu.be"]
allowed_upload_origins = []

[cluster]
enabled = false
strategy = "epmd"
topology_name = "gsmlg"
hosts = []
connect_interval = 30000
gossip_port = 45892
gossip_if_addr = "0.0.0.0"
gossip_multicast_addr = "233.252.1.32"
gossip_multicast_ttl = 1
gossip_secret = ""
gossip_broadcast_only = false

[oauth.github]
client_id = ""
client_secret = ""

[i18n]
default_locale = "zh-Hans"

[web_push]
subject = "mailto:test@gsmlg.com"
public_key = "test_public_key"
private_key = "test_private_key"

[proxy_rules]
source_url = "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt"
remote_refresh_interval = 86400000
remote_connect_timeout = 5000
remote_receive_timeout = 30000
remote_max_body_size = 10000000
retry_min_interval = 5000
retry_max_interval = 300000
retry_jitter = true
local_proxy_list_path = "/etc/gsmlg/proxy-rules/proxy-list.txt"
local_direct_list_path = "/etc/gsmlg/proxy-rules/direct-list.txt"
local_watch_debounce = 500
local_reconciliation_interval = 60000
state_directory = "/var/lib/gsmlg/proxy-rules"
cache_control = "public, max-age=3600"
unsupported_rule_sample_limit = 20
