[gsmlg]
mnesia_dir = ""

[logger]
log_level = "info"

[database]
username = "gsmlg_prod"
password = "change_me_in_production"
hostname = "postgresql-server.gsmlg.net"
port = 5432
database = "gsmlg_prod"
show_sensitive_data_on_connection_error = false
pool_size = 20

[web]
url = "https://gsmlg.org"
secret_key_base = "CHANGE_ME_IN_PRODUCTION_USE_mix_phx.gen.secret"
port = 4110
user_register = false
enable_adsense = true
