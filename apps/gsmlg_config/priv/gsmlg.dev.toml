[gsmlg]

[logger]
log_level = "debug"

[database]
username = "gsmlg_dev"
password = "gsmlg_dev"
database = "gsmlg_dev"
show_sensitive_data_on_connection_error = true
pool_size = 10

[web]
url = "http://localhost:4110"
secret_key_base = "o5xg8yDgSOFVrcrH4seZJ7+wJie4BHGOHmf9wP4mlhDFPPIqNETW8GU+gKVgrtFs"
port = 4110
user_register = true
enable_adsense = false
show_icp = false

[admin_web]
url = "http://localhost:4111"
secret_key_base = "o5xg8yDgSOFVrcrH4seZJ7+wJie4BHGOHmf9wP4mlhDFPPIqNETW8GU+gKVgrtFs"
port = 4111
user_register = false

[commander]
start = false
name = "commander"
platform_url = "ws://localhost:4111/commander-socket/websocket"
platform_key = "o5xg8yDgSOFVrcrH4seZJ7+w"

[cluster]
enabled = false
strategy = "epmd"
topology_name = "gsmlg"
hosts = []
connect_interval = 30000
gossip_port = 45892
gossip_if_addr = "0.0.0.0"
gossip_multicast_addr = "233.252.1.32"
gossip_multicast_ttl = 1
gossip_secret = ""
gossip_broadcast_only = false

[oauth.github]
client_id = ""
client_secret = ""

[storage]
s3_bucket = "gsmlg-storage"
s3_endpoint = "http://localhost:9000"
s3_region = "us-east-1"
max_file_size = 5368709120
cleanup_interval = 3600000
retention_window = 2592000

[web_push]
subject = "mailto:administrator@gsmlg.com"
public_key = "BIiu8m_dqtrKSvdquIqUJxsrkwswa0Zgep4myzmHlUcHjEtRdxdK4bZAEAd4dhFTARNGrbIkOJIcjdn13Z-yC4w"
private_key = "7mYUWrgUKIE_YGuFaIw2bRO0WjreR0iY6WoE7mDwbak"

[proxy_rules]
source_url = "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt"
remote_refresh_interval = 86400000
remote_connect_timeout = 5000
remote_receive_timeout = 30000
remote_max_body_size = 10000000
retry_min_interval = 5000
retry_max_interval = 300000
retry_jitter = true
local_proxy_list_path = ".devenv/state/proxy-rules/sources/proxy/proxy-list.txt"
local_direct_list_path = ".devenv/state/proxy-rules/sources/direct/direct-list.txt"
local_watch_debounce = 500
local_reconciliation_interval = 60000
state_directory = ".devenv/state/proxy-rules"
cache_control = "public, max-age=3600"
unsupported_rule_sample_limit = 20

[scout.general]
instance_name = "GSMLG Scout"
default_region = "local"
request_timeout_ms = 30000

[scout.rabbitmq]
enabled = true
url = "amqp://guest:guest@localhost:5672"

[scout.rabbitmq.queues]
jobs = "scout.fetch.jobs"
results = "scout.fetch.results"
failed = "scout.fetch.failed"
heartbeat = "scout.agent.heartbeat"

[scout.rabbitmq.regional_queues]
eu = "scout.fetch.jobs.eu"
us = "scout.fetch.jobs.us"
asia = "scout.fetch.jobs.asia"

[scout.fetch]
default_timeout_ms = 30000
max_timeout_ms = 60000
max_page_size_bytes = 5000000

[scout.fetch.browser]
wait_until = "network_idle"
wait_for = ""
javascript = true

[scout.fetch.retry]
max_attempts = 3
base_backoff_ms = 500
max_backoff_ms = 5000
jitter = true

[scout.agent]
enabled = false
id = ""
region = "local"
heartbeat_interval_ms = 10000
capacity = 16
browser_instances = 2
page_concurrency = 16
lightpanda_path = "scripts/lightpanda-docker"

[scout.security]
allowed_schemes = ["http", "https"]
redirect_limit = 5
blocked_cidrs = [
