name: release
on:
  workflow_dispatch:
    inputs:
      release-version:
        required: true
        description: 'The version of the release'
        type: string
      revision:
        required: true
        description: 'The git ref to build from'
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.release-version }}
  HEX_MIRROR: https://repo.hex.pm

jobs:
  prepare-release:
    name: Prepare versioned release source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Prepare source commit and tag
        id: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/prepare_release.sh "$RELEASE_VERSION"

  build-docker:
    name: Build Docker image
    needs: [prepare-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source-sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            HEX_MIRROR=https://repo.hex.pm
            RELEASE_VERSION=${{ github.event.inputs.release-version }}
            DATABASE_URL=ecto://USER:PASS@HOST/DATABASE
          no-cache: true
          tags: |
            ghcr.io/gsmlg-dev/gsmlg-umbrella:v${{ github.event.inputs.release-version }}
            ghcr.io/gsmlg-dev/gsmlg-umbrella:latest

      - name: Write Docker image info
        run: |
          VERSION="$RELEASE_VERSION"
          cat > docker-image-info.md <<EOF
          ## Docker Image

          \`\`\`
          docker pull ghcr.io/gsmlg-dev/gsmlg-umbrella:v${VERSION}
          \`\`\`

          ### Available tags

          - \`ghcr.io/gsmlg-dev/gsmlg-umbrella:v${VERSION}\`
          - \`ghcr.io/gsmlg-dev/gsmlg-umbrella:latest\`

          ### Platforms

          - \`linux/amd64\`
          EOF

      - name: Upload Docker image info
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-info
          path: docker-image-info.md

  build-elixir:
    name: Build Elixir releases (linux/amd64)
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source-sha }}

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install deps
        env:
          MIX_ENV: prod
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bash scripts/update_version.sh --check "$RELEASE_VERSION"
          mix deps.get
          mix compile
          mix npm.ci

      - name: Build release
        env:
          MIX_ENV: prod
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          DATABASE_URL: "ecto://USER:PASS@HOST/DATABASE"
        run: |
          bash scripts/update_version.sh --check "$RELEASE_VERSION"
          mix prerelease
          mix release gsmlg_umbrella
          mix release gsmlg_scout_agent
          cp -r _build/prod/rel/gsmlg_umbrella gsmlg
          tar zcf gsmlg.tar.gz gsmlg
          cp -r _build/prod/rel/gsmlg_scout_agent gsmlg_scout_agent
          tar zcf gsmlg_scout_agent.tar.gz gsmlg_scout_agent

      - name: Upload release tarballs
        uses: actions/upload-artifact@v7
        with:
          name: elixir-releases
          path: "*.tar.gz"

  build-commander:
    name: Build Commander (${{ matrix.target }})
    needs: [prepare-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            freebsd: false
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            freebsd: false
          - target: macos-amd64
            runner: macos-15-intel
            freebsd: false
          - target: macos-arm64
            runner: macos-15
            freebsd: false
          - target: windows-amd64
            runner: windows-latest
            freebsd: false
          - target: freebsd-amd64
            runner: ubuntu-latest
            freebsd: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source-sha }}

      - name: Setup Elixir
        if: ${{ matrix.freebsd == false }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Install deps
        if: ${{ matrix.freebsd == false }}
        shell: bash
        env:
          MIX_ENV: prod
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/update_version.sh --check "$RELEASE_VERSION"
          mix deps.get

      - name: Build Commander release
        if: ${{ matrix.freebsd == false }}
        shell: bash
        env:
          MIX_ENV: prod
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          DATABASE_URL: "ecto://USER:PASS@HOST/DATABASE"
        run: |
          bash scripts/update_version.sh --check "$RELEASE_VERSION"
          mix deps.compile --include-children phoenix phoenix_live_view telemetry
          (
            cd apps/gsmlg_commander
            mix deps.compile --include-children
            mix compile
          )
          (
            cd apps/gsmlg_browser_agent
            mix deps.compile --include-children
            mix compile
          )
          mix release gsmlg_commander --overwrite --no-compile
          cp "_build/prod/gsmlg_commander-${RELEASE_VERSION}.tar.gz" "commander-${{ matrix.target }}.tar.gz"

      - name: Build Commander release on FreeBSD
        if: ${{ matrix.freebsd == true }}
        uses: vmactions/freebsd-vm@v1
        env:
          MIX_ENV: prod
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          DATABASE_URL: "ecto://USER:PASS@HOST/DATABASE"
        with:
          release: "14.4"
          arch: x86_64
          usesh: true
          sync: rsync
          envs: "MIX_ENV RELEASE_VERSION DATABASE_URL"
          prepare: |
            pkg install -y bash ca_root_nss elixir-devel erlang-runtime28 git gmake
          run: |
            set -eu
            export PATH="/usr/local/lib/erlang28/bin:$PATH"
            mix local.hex --force
            mix local.rebar --force
            bash scripts/update_version.sh --check "$RELEASE_VERSION"
            mix deps.get
            mix deps.compile --include-children phoenix phoenix_live_view telemetry
            (
              cd apps/gsmlg_commander
              mix deps.compile --include-children
              mix compile
            )
            (
              cd apps/gsmlg_browser_agent
              mix deps.compile --include-children
              mix compile
            )
            mix release gsmlg_commander --overwrite --no-compile
            cp "_build/prod/gsmlg_commander-${RELEASE_VERSION}.tar.gz" commander-freebsd-amd64.tar.gz

      - name: Upload Commander release
        uses: actions/upload-artifact@v7
        with:
          name: commander-release-${{ matrix.target }}
          path: commander-${{ matrix.target }}.tar.gz

  create-release:
    name: Create GitHub release v${{ github.event.inputs.release-version }}
    runs-on: ubuntu-latest
    needs: [prepare-release, build-docker, build-elixir, build-commander]
    permissions:
      contents: write
    steps:
      - name: Download Elixir release tarballs
        uses: actions/download-artifact@v8
        with:
          name: elixir-releases

      - name: Download Commander release tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: commander-release-*
          merge-multiple: true

      - name: Download Docker image info
        uses: actions/download-artifact@v8
        with:
          name: docker-image-info

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.release-version }}
          target_commitish: ${{ needs.prepare-release.outputs.source-sha }}
          name: v${{ github.event.inputs.release-version }}
          body_path: docker-image-info.md
          generate_release_notes: true
          files: |
            *.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
