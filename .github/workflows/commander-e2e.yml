name: Commander E2E Tests

on:
  # Manual trigger with optional parameters
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tags to run (comma-separated, e.g., terminal,connection)'
        required: false
        type: string
      scenario:
        description: 'Specific scenario to run'
        required: false
        type: string
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: false

  # Trigger on PRs that modify Commander-related files
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/gsmlg_commander/**'
      - 'apps/gsmlg_commander_test/**'
      - 'apps/gsmlg_admin_web/lib/gsmlg/admin_web/live/commander_live/**'
      - 'apps/gsmlg_admin_web/lib/gsmlg/admin_web/channels/commander_*'

jobs:
  e2e-test:
    name: Commander E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile
        run: mix compile

      - name: List available scenarios
        run: mix commander.e2e --list

      - name: Run E2E tests
        run: |
          ARGS=""

          # Add tags if specified
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            ARGS="$ARGS --tags ${{ github.event.inputs.tags }}"
          fi

          # Add scenario if specified
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            ARGS="$ARGS --scenario ${{ github.event.inputs.scenario }}"
          fi

          # Add verbose if enabled
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            ARGS="$ARGS --verbose"
          fi

          echo "Running: mix commander.e2e $ARGS"
          mix commander.e2e $ARGS
        env:
          MIX_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            _build/test/lib/gsmlg_commander_test/
          if-no-files-found: ignore
