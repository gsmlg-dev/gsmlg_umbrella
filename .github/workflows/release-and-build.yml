name: elixir-gsmlg-build-and-release
on:
  workflow_dispatch:
    inputs:
      release-version:
        required: true
        description: 'The version of the release'
        default: '4.18.3'

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 💊 Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.17.3"

      - name: 🚀 Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MIX_ENV: prod
        run: |
          echo "release_verison = ${{ github.event.inputs.release-version }}"
          mix deps.get
          mix format --check-formatted

  build-docker-image:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}
      - 
        name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          build-args: |
            IMAGE_REGISTRY=docker.io
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
            HEX_MIRROR=https://repo.hex.pm
            RELEASE_VERSION=${{ github.event.inputs.release-version }}
          tags: |
            ghcr.io/gsmlg-dev/gsmlg-umbrella:v${{ github.event.inputs.release-version }}
            ghcr.io/gsmlg-dev/gsmlg-umbrella:latest

  build-package-amd64:
    name: Build otp relase package linux amd64
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 💊 Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.17.3"

      - name: Setup zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install xz
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: ⚙️ Run build
        env:
          MIX_ENV: prod
          RELEASE_NAME: gsmlg_umbrella
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
        run: |
          mix deps.get
          npm install
          cd ${{ github.workspace }}/apps/gsmlg_web
          mix assets.deploy
          cd ${{ github.workspace }}/apps/gsmlg_admin_web
          mix assets.deploy
          cd ${{ github.workspace }}
          mix release gsmlg_umbrella --version ${RELEASE_VERSION}
          mix relaase gsmlg_commander --version ${RELEASE_VERSION}
          cp -r _build/prod/rel/gsmlg_umbrella gsmlg
          tar zcf gsmlg.tar.gz gsmlg
          cp -r _build/prod/rel/gsmlg_commander commander
          tar zcf commander.tar.gz commander

      - name: ⬆️ Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: gsmlg.tar.gz
          asset_name: gsmlg-umbrella_linux-amd64.tar.gz
          tag: v${{ github.event.inputs.release-version }}
          overwrite: true

