name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gsmlg_test
          POSTGRES_PASSWORD: gsmlg_test
          # Don't auto-create database - let Ecto manage it
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: gsmlg_test
      POSTGRES_PASSWORD: gsmlg_test
      POSTGRES_DB: gsmlg_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Setup database
        env:
          MIX_ENV: test
          # Skip Sandbox pool for migrations to avoid lock issues
          SKIP_SANDBOX_POOL: "true"
        run: |
          # Debug: Print Repo config (using eval to avoid starting app)
          echo "=== REPO CONFIG ==="
          mix eval 'IO.inspect(Application.get_env(:gsmlg, GSMLG.Repo), label: "Repo config", limit: :infinity)'
          echo "==================="
          mix ecto.drop --force || true
          mix ecto.create
          mix ecto.migrate

      - name: Run tests
        env:
          MIX_ENV: test
          REDIS_URL: redis://localhost:6379
        run: mix test

      - name: Generate coverage report
        if: success()
        env:
          MIX_ENV: test
          REDIS_URL: redis://localhost:6379
        run: mix coveralls.html

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover/
