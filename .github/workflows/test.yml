name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gsmlg_test
          POSTGRES_PASSWORD: gsmlg_test
          # Don't auto-create database - let Ecto manage it
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      ess:
        # ESS 0.6.10; MinIO no longer publishes community images or binaries.
        image: ghcr.io/gsmlg-dev/ess:0.6.10@sha256:c5a4596ca71fd13ed8d6912f203694b074bd9c769adde60ce0b3ab2a1ead9c09
        env:
          ESS_S3_AUTH_ENABLED: "true"
          ESS_WEB_ENABLED: "false"
          # Disposable CI-only encryption key, never used outside this service.
          ESS_MASTER_KEY: "0123456789abcdef0123456789abcdef"
          ERL_FLAGS: "+S 4:4"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: gsmlg_test
      POSTGRES_PASSWORD: gsmlg_test
      POSTGRES_DB: gsmlg_test
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inotify-tools libvips-dev

      - name: Create authenticated S3 test storage
        env:
          ESS_CONTAINER: ${{ job.services.ess.id }}
        run: |
          docker exec "$ESS_CONTAINER" /app/bin/ess rpc '
            alias ExStorageService.IAM.{User, Policy, AccessKey}
            {:ok, user} = User.create_user("ci")
            {:ok, policy} = Policy.create_policy("ci-full-access", Policy.full_access_statements())
            :ok = Policy.attach_policy(user.id, policy.id)
            {:ok, _key} = AccessKey.create_fixed_access_key(user.id, "minioadmin", "minioadmin")
            :ok
          '
          curl --fail-with-body --silent --show-error \
            --aws-sigv4 "aws:amz:$AWS_REGION:s3" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            --request PUT "$AWS_ENDPOINT_URL/gsmlg-storage"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '28'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-elixir-${{ steps.beam.outputs.elixir-version }}-otp-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-elixir-${{ steps.beam.outputs.elixir-version }}-otp-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install JavaScript dependencies
        run: mix npm.ci

      - name: Run JavaScript tests
        run: npm test

      - name: Setup database
        env:
          MIX_ENV: test
          SKIP_SANDBOX_POOL: "true"
        run: |
          mix ecto.drop --force || true
          mix ecto.create
          mix ecto.migrate

      - name: Run tests
        env:
          MIX_ENV: test
        run: mix test
